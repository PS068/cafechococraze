<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ps-resto-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Premium Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#ps-resto-grad)" />

  <!-- Inner Soft Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Crossed Fork & Spoon / Knife (UtensilsCrossed) -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Fork diagonal -->
    <path d="M18 16 l10 10 M14 20 l10 10 M16 18 l28 28 M44 46 l4 4" />
    <!-- Knife / Spoon diagonal -->
    <path d="M46 18 c2 2 2 5 -1 8 l-27 27 M46 18 c-2 -2 -5 -2 -8 1 l-6 6" />
  </g>

  <!-- Accent Star / Sparkle in Top Corner -->
  <circle cx="50" cy="14" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>